<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои Поездки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0e0e12;--surface:#16161c;--surface2:#1e1e28;--border:#2a2a38;
  --accent:#f0c040;--accent2:#7c6ff0;--ok:#3dd68c;--warn:#f07850;--danger:#f05060;
  --text:#e8e8f0;--muted:#8888a8;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-text-size-adjust:100%;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;}
.auth-box h1{font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent);margin-bottom:4px;}
.auth-box .sub{color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:24px;}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface2);border-radius:8px;padding:4px;}
.auth-tab{flex:1;padding:9px;border:none;background:none;color:var(--muted);font-family:var(--mono);font-size:12px;border-radius:6px;cursor:pointer;transition:.2s;}
.auth-tab.active{background:var(--accent2);color:#fff;}
.afield{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.afield label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.afield input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:14px;padding:11px 12px;outline:none;width:100%;}
.afield input:focus{border-color:var(--accent2);}
.btn-primary{width:100%;padding:12px;border:none;border-radius:8px;font-family:var(--mono);font-size:13px;cursor:pointer;background:var(--accent2);color:#fff;}
.auth-err{font-size:11px;font-family:var(--mono);margin-top:10px;text-align:center;min-height:16px;color:var(--danger);}

/* HEADER */
.header{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:100;}
.header h1{font-family:var(--display);font-size:16px;font-weight:800;color:var(--accent);flex:1;}
.rate-badge{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;}
.rate-badge span{color:var(--ok);}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;}
.back-btn{background:none;border:none;color:var(--accent2);font-family:var(--mono);font-size:12px;cursor:pointer;padding:4px 6px;white-space:nowrap;}
.header-total{font-family:var(--mono);font-size:12px;color:var(--ok);white-space:nowrap;}

/* HOME */
.home{padding:16px;}
.home-title{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px;}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;margin-bottom:12px;}
.trip-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.2s;position:relative;}
.trip-card:hover{border-color:var(--accent2);}
.trip-card h3{font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:6px;padding-right:24px;}
.trip-meta{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
.trip-price{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ok);margin-top:10px;}
.trip-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px;}
.trip-del:hover{color:var(--danger);}
.add-trip-box{background:var(--surface2);border:2px dashed var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;}
.add-trip-box input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;padding:10px 12px;outline:none;width:100%;}
.add-trip-box input:focus{border-color:var(--accent2);}
.btn-add{background:var(--accent2);color:#fff;border:none;border-radius:8px;padding:11px;font-family:var(--mono);font-size:12px;cursor:pointer;width:100%;}

/* TRIP DETAIL */
.trip-detail{display:grid;grid-template-columns:1fr 270px;min-height:calc(100vh - 53px);}
@media(max-width:680px){.trip-detail{grid-template-columns:1fr;}.sidebar{border-left:none;border-top:1px solid var(--border);}}
.segments{padding:14px 16px;border-right:1px solid var(--border);}
.seg-list{display:flex;flex-direction:column;gap:8px;}
.stitle{font-family:var(--display);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}

/* SEGMENT */
.seg{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.2s;}
.seg.draft{border-color:var(--accent);}
.seg-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.sicon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.icon-train{background:rgba(124,111,240,.15);}
.icon-bus{background:rgba(61,214,140,.12);}
.icon-flight{background:rgba(240,192,64,.15);}
.sinfo{flex:1;min-width:0;}
.sroute{font-family:var(--display);font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.arr{color:var(--muted);}
.smeta{margin-top:2px;color:var(--muted);font-size:10px;font-family:var(--mono);display:flex;gap:6px;flex-wrap:wrap;}
.sprice{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ok);text-align:right;flex-shrink:0;}
.sprice .orig{font-size:9px;color:var(--muted);}
.draftbadge{background:rgba(240,192,64,.15);color:var(--accent);border:1px solid rgba(240,192,64,.3);border-radius:3px;padding:1px 4px;font-size:8px;font-family:var(--mono);}
.chev{color:var(--muted);transition:transform .2s;font-size:9px;margin-left:2px;flex-shrink:0;}
.chev.open{transform:rotate(180deg);}
.tpill{font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:3px;font-weight:500;}
.tp-train{background:rgba(124,111,240,.2);color:#a09af0;}
.tp-bus{background:rgba(61,214,140,.15);color:#5dd6a0;}
.tp-flight{background:rgba(240,192,64,.2);color:var(--accent);}

/* SEG EDIT */
.seg-edit{display:none;border-top:1px solid var(--border);padding:12px;background:var(--surface2);flex-direction:column;gap:9px;}
.seg-edit.open{display:flex;}
.frow{display:flex;gap:7px;flex-wrap:wrap;}
.efield{display:flex;flex-direction:column;gap:3px;flex:1;min-width:85px;}
.efield label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.efield input,.efield select{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px;outline:none;width:100%;}
.efield input:focus,.efield select:focus{border-color:var(--accent2);}

/* PRICE */
.price-block{display:flex;flex-direction:column;gap:5px;}
.price-block label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.price-inner{display:flex;gap:6px;align-items:center;}
.price-inner input{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px;outline:none;flex:1;}
.price-inner input:focus{border-color:var(--accent2);}
.cur-row{display:flex;gap:4px;}
.cur-btn{padding:7px 10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:5px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:.2s;}
.cur-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,111,240,.1);}
.price-hint{font-size:10px;color:var(--ok);font-family:var(--mono);padding:5px 8px;background:rgba(61,214,140,.06);border-radius:5px;border:1px solid rgba(61,214,140,.15);}

/* SEARCH */
.search-btns{display:flex;flex-direction:column;gap:5px;}
.search-title{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.search-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:none;width:100%;transition:.2s;}
.search-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.sb-label{flex:1;text-align:left;}
.sb-arrow{color:var(--muted);}

.row-btns{display:flex;gap:7px;justify-content:space-between;}
.sbtn{background:var(--accent2);color:#fff;border:none;border-radius:5px;padding:8px 14px;font-family:var(--mono);font-size:11px;cursor:pointer;}
.delbtn{background:rgba(240,80,96,.12);color:var(--danger);border:1px solid rgba(240,80,96,.3);border-radius:5px;padding:8px 14px;font-family:var(--mono);font-size:11px;cursor:pointer;}

/* ADD SEG */
.add-seg-box{background:var(--surface2);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:8px;}
.seg-type-row{display:flex;gap:5px;margin-bottom:9px;}
.type-btn{flex:1;padding:8px 4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;font-family:var(--mono);font-size:10px;cursor:pointer;text-align:center;transition:.2s;}
.type-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,111,240,.1);}

/* ALERTS */
.alerts{padding:8px 16px 4px;}
.alert{display:flex;align-items:flex-start;gap:6px;padding:7px 10px;border-radius:7px;margin-bottom:5px;font-size:11px;font-family:var(--mono);line-height:1.5;}
.alert.info{background:rgba(124,111,240,.08);border:1px solid rgba(124,111,240,.25);color:#a09af0;}
.alert.ok{background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.2);color:var(--ok);}
.alert.warn{background:rgba(240,120,80,.1);border:1px solid rgba(240,120,80,.25);color:var(--warn);}

/* SIDEBAR */
.sidebar{padding:14px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.sc h3{padding:8px 11px;font-family:var(--display);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
.bgt{padding:7px 11px;}
.brow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:10px;}
.brow:last-child{border-bottom:none;}
.brow .lb{color:var(--muted);font-family:var(--mono);font-size:9px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brow .am{font-family:var(--mono);color:var(--text);}
.btotal{display:flex;justify-content:space-between;align-items:baseline;padding:8px 11px;border-top:2px solid var(--border);font-family:var(--display);font-weight:700;font-size:11px;}
.btotal .am{color:var(--accent);font-size:15px;}
.tl{padding:8px 11px;display:flex;flex-direction:column;}
.tli{display:flex;gap:8px;padding-bottom:9px;}
.tli:last-child{padding-bottom:0;}
.tdc{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0;}
.td{width:8px;height:8px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);margin-top:2px;flex-shrink:0;}
.td.flight{background:var(--accent);}
.tline{flex:1;width:1px;background:var(--border);margin-top:2px;}
.tco{flex:1;}
.tdate{font-family:var(--mono);font-size:9px;color:var(--muted);}
.tlbl{font-size:11px;font-weight:500;margin-top:1px;}
.tsub{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:1px;}

.rates-card{padding:9px 11px;font-family:var(--mono);font-size:10px;line-height:1.9;}
.rate-row{display:flex;justify-content:space-between;}
.rate-row .rv{color:var(--ok);}
.rate-updated{color:var(--muted);font-size:9px;margin-top:4px;}

.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--mono);color:var(--muted);}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPA_URL='https://fbcdmhvjfnjioecqlnpf.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiY2RtaHZqZm5qaW9lY3FsbnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDYzNTYsImV4cCI6MjA5NDUyMjM1Nn0.XnvAFJSVjP2vC0rL4guedpievJqm6Jp3sIxiSLwueRQ';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// Курсы — дефолт, обновляются при загрузке
let RATES={USD:44,EUR:51,UAH:1};
let ratesUpdated='загрузка...';

async function fetchRates(){
  try{
    const r=await fetch('https://api.exchangerate-api.com/v4/latest/UAH');
    const d=await r.json();
    if(d.rates){
      RATES.USD=+(1/d.rates.USD).toFixed(2);
      RATES.EUR=+(1/d.rates.EUR).toFixed(2);
      ratesUpdated='обновлено сейчас';
      // Обновить отображение курса в хедере если он есть
      const rb=document.getElementById('rate-badge-val');
      if(rb)rb.textContent=`$ ${RATES.USD} ₴ · € ${RATES.EUR} ₴`;
      const rc=document.getElementById('rates-card');
      if(rc)renderRatesCard();
    }
  }catch(e){
    ratesUpdated='офлайн, курс примерный';
  }
}

let currentUser=null,currentTrip=null,currentSegs=[],newSegType='flight';
let drafts={};
const app=document.getElementById('app');

function toUAH(amount,cur){return+(amount*(RATES[cur]||RATES.USD)).toFixed(2);}
function fmt(uah){return Math.round(uah).toLocaleString('ru-RU')+' ₴';}
function fmtD(d){if(!d)return'?';const[,m,day]=d.split('-');const mn=['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];return`${+day} ${mn[+m]}`;}
const tlabel={train:'ПОЕЗД',bus:'АВТОБУС',flight:'РЕЙС'};
const icons={train:'🚂',bus:'🚌',flight:'✈️'};
const curSym={USD:'$',EUR:'€',UAH:'₴'};

function saveDraft(id,data){drafts[id]=data;try{localStorage.setItem('drafts_'+currentTrip?.id,JSON.stringify(drafts));}catch(e){}}
function loadDrafts(tid){try{const d=localStorage.getItem('drafts_'+tid);drafts=d?JSON.parse(d):{};}catch(e){drafts={};}}
function clearDraft(id){delete drafts[id];try{localStorage.setItem('drafts_'+currentTrip?.id,JSON.stringify(drafts));}catch(e){}}
function getSeg(i){const s=currentSegs[i];return drafts[s.id]?{...s,...drafts[s.id]}:s;}
function hasDraft(i){return!!drafts[currentSegs[i]?.id];}

function searchLinks(s){
  const f=s.from_city||'',t=s.to_city||'',d=s.date_from||'';
  if(s.type==='flight')return[
    {icon:'🔍',label:'Google Flights',url:`https://www.google.com/travel/flights?hl=ru`},
    {icon:'✈',label:'Skyscanner',url:`https://www.skyscanner.com/transport/flights/${encodeURIComponent(f)}/${encodeURIComponent(t)}/`},
    {icon:'💰',label:'Kiwi.com',url:`https://www.kiwi.com/en/search/results/${encodeURIComponent(f)}/${encodeURIComponent(t)}/${d}/no-return`},
  ];
  if(s.type==='bus')return[
    {icon:'🚌',label:'FlixBus',url:`https://shop.flixbus.com/search?departureCity=${encodeURIComponent(f)}&arrivalCity=${encodeURIComponent(t)}&rideDate=${d}&adult=1`},
    {icon:'🔍',label:'Busbud',url:`https://www.busbud.com/`},
    {icon:'🚌',label:'Ecolines',url:`https://ecolines.net/`},
  ];
  return[
    {icon:'🚂',label:'Укрзалізниця',url:`https://booking.uz.gov.ua/`},
    {icon:'🚆',label:'PKP (Польша)',url:`https://www.pkp.pl/en/timetable`},
    {icon:'🔍',label:'Rail.cc',url:`https://rail.cc/ru/train/${encodeURIComponent(f)}-to-${encodeURIComponent(t)}`},
  ];
}

async function init(){
  showLoading();
  fetchRates(); // запускаем в фоне
  const {data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user;showHome();}
  else showAuth();
  sb.auth.onAuthStateChange((_,s)=>{
    if(s){currentUser=s.user;showHome();}
    else{currentUser=null;showAuth();}
  });
}

function showLoading(){app.innerHTML=`<div class="loading"><div class="spinner"></div>Загрузка...</div>`;}

function showAuth(tab='login'){
  app.innerHTML=`
  <div class="auth-wrap"><div class="auth-box">
    <h1>✈ Мои Поездки</h1>
    <div class="sub">Планировщик маршрутов</div>
    <div class="auth-tabs">
      <button class="auth-tab ${tab==='login'?'active':''}" onclick="showAuth('login')">Войти</button>
      <button class="auth-tab ${tab==='reg'?'active':''}" onclick="showAuth('reg')">Регистрация</button>
    </div>
    <div class="afield"><label>Email</label><input type="email" id="em" placeholder="you@example.com"></div>
    <div class="afield"><label>Пароль</label><input type="password" id="pw" placeholder="минимум 6 символов"></div>
    ${tab==='login'
      ?`<button class="btn-primary" onclick="doLogin()">Войти</button>`
      :`<button class="btn-primary" onclick="doReg()">Создать аккаунт</button>`}
    <div class="auth-err" id="aerr"></div>
  </div></div>`;
}
async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value,password:document.getElementById('pw').value});
  if(error)document.getElementById('aerr').textContent=error.message;
}
async function doReg(){
  const {error}=await sb.auth.signUp({email:document.getElementById('em').value,password:document.getElementById('pw').value,options:{emailRedirectTo:'https://izienglish.github.io/my_trip/'}});
  const el=document.getElementById('aerr');
  if(error){el.style.color='var(--danger)';el.textContent=error.message;}
  else{el.style.color='var(--ok)';el.textContent='Проверьте почту!';}
}
async function doLogout(){await sb.auth.signOut();}

async function showHome(){
  showLoading();
  const {data:trips}=await sb.from('trips').select('*').order('created_at');
  const segsAll=trips?.length?(await sb.from('segments').select('*').in('trip_id',trips.map(t=>t.id))).data||[]:[];
  const cards=(trips||[]).map(t=>{
    const segs=segsAll.filter(s=>s.trip_id===t.id).sort((a,b)=>a.position-b.position);
    const total=segs.reduce((a,s)=>a+toUAH(+s.price_amount||0,s.price_currency||'USD'),0);
    const dates=segs.length?`${fmtD(segs[0].date_from)} – ${fmtD(segs[segs.length-1].date_from)}`:'—';
    const route=segs.length?`${segs[0].from_city||'?'} → ${segs[segs.length-1].to_city||'?'}`:'—';
    return`<div class="trip-card" onclick="openTrip('${t.id}','${t.name.replace(/'/g,"\\'")}')">
      <button class="trip-del" onclick="event.stopPropagation();delTrip('${t.id}')">✕</button>
      <h3>${t.name}</h3>
      <div class="trip-meta"><span>📍 ${route}</span><span>📅 ${dates}</span><span>🧩 ${segs.length} сегм.</span></div>
      <div class="trip-price">${total>0?fmt(total):'—'}</div>
    </div>`;
  }).join('');
  app.innerHTML=`
  <div class="header">
    <h1>✈ Мои Поездки</h1>
    <span class="rate-badge">$ <span id="rate-badge-val">${RATES.USD} ₴ · € ${RATES.EUR} ₴</span></span>
    <button class="logout-btn" onclick="doLogout()">Выйти</button>
  </div>
  <div class="home">
    <div class="home-title">Мои отпуска</div>
    <div class="trips-grid">
      ${cards}
      <div class="add-trip-box">
        <input type="text" id="ntn" placeholder="Название (напр. Израиль 2026)">
        <button class="btn-add" onclick="addTrip()">+ Добавить поездку</button>
      </div>
    </div>
  </div>`;
}

async function addTrip(){
  const name=document.getElementById('ntn').value.trim();
  if(!name)return;
  await sb.from('trips').insert({name,user_id:currentUser.id});
  showHome();
}
async function delTrip(id){
  if(!confirm('Удалить поездку со всеми сегментами?'))return;
  await sb.from('trips').delete().eq('id',id);showHome();
}

async function openTrip(id,name){
  currentTrip={id,name};showLoading();
  loadDrafts(id);
  const {data}=await sb.from('segments').select('*').eq('trip_id',id).order('position');
  currentSegs=data||[];
  renderTrip();
}

function calcTotal(){
  return currentSegs.reduce((a,s,i)=>{const d=getSeg(i);return a+toUAH(+d.price_amount||0,d.price_currency||'USD');},0);
}

function renderTrip(){
  const total=calcTotal();
  app.innerHTML=`
  <div class="header">
    <button class="back-btn" onclick="showHome()">← Назад</button>
    <h1>${currentTrip.name}</h1>
    <span class="rate-badge" style="display:none" id="rate-badge-val2"></span>
    <span class="header-total" id="trip-total">${fmt(total)}</span>
    <button class="logout-btn" onclick="doLogout()">Выйти</button>
  </div>
  <div id="alerts-box" class="alerts"></div>
  <div class="trip-detail">
    <div class="segments">
      <div class="stitle">Сегменты маршрута</div>
      <div class="seg-list" id="seg-list"></div>
      <div class="add-seg-box" style="margin-top:10px">
        <div class="stitle">+ Новый сегмент</div>
        <div class="seg-type-row" id="type-row">
          <button class="type-btn ${newSegType==='train'?'active':''}" onclick="setType('train',this)">🚂 Поезд</button>
          <button class="type-btn ${newSegType==='bus'?'active':''}" onclick="setType('bus',this)">🚌 Автобус</button>
          <button class="type-btn ${newSegType==='flight'?'active':''}" onclick="setType('flight',this)">✈️ Рейс</button>
        </div>
        <div class="frow" style="margin-bottom:8px">
          <div class="efield"><label>Откуда</label><input id="ns-from" placeholder="Киев"></div>
          <div class="efield"><label>Куда</label><input id="ns-to" placeholder="Варшава"></div>
          <div class="efield"><label>Дата</label><input type="date" id="ns-date"></div>
        </div>
        <button class="btn-add" onclick="addSeg()">+ Добавить</button>
      </div>
    </div>
    <div class="sidebar">
      <div class="sc"><h3>📅 Хронология</h3><div class="tl" id="tl"></div></div>
      <div class="sc"><h3>💰 Бюджет</h3><div class="bgt" id="bgt"></div><div class="btotal"><span>ИТОГО</span><span class="am" id="btotal-val">—</span></div></div>
      <div class="sc"><h3>💱 Курс валют</h3><div class="rates-card" id="rates-card"></div></div>
    </div>
  </div>`;
  renderSegList();renderAlerts();renderTL();renderBgt();renderRatesCard();
}

function renderRatesCard(){
  const el=document.getElementById('rates-card');if(!el)return;
  el.innerHTML=`
    <div class="rate-row"><span>1 USD</span><span class="rv">= ${RATES.USD} ₴</span></div>
    <div class="rate-row"><span>1 EUR</span><span class="rv">= ${RATES.EUR} ₴</span></div>
    <div class="rate-row"><span>1 UAH</span><span class="rv">= 1 ₴</span></div>
    <div class="rate-updated">🔄 ${ratesUpdated}</div>`;
}

function renderSegList(){
  document.getElementById('seg-list').innerHTML=currentSegs.map((seg,i)=>{
    const s=getSeg(i);
    const isDraft=hasDraft(i);
    const uah=toUAH(+s.price_amount||0,s.price_currency||'USD');
    const cur=s.price_currency||'USD';
    const sym=curSym[cur]||'$';
    const links=searchLinks(s);
    const linksHTML=links.map(l=>`<a class="search-btn" href="${l.url}" target="_blank" rel="noopener">
      <span>${l.icon}</span><span class="sb-label">${l.label}</span><span class="sb-arrow">↗</span>
    </a>`).join('');
    return`<div class="seg ${isDraft?'draft':''}">
    <div class="seg-hdr" onclick="togSeg(${i})">
      <div class="sicon icon-${s.type}">${icons[s.type]||'📍'}</div>
      <div class="sinfo">
        <div class="sroute">
          <span class="tpill tp-${s.type}">${tlabel[s.type]||s.type}</span>
          ${s.from_city||'?'}<span class="arr">→</span>${s.to_city||'?'}
          ${isDraft?'<span class="draftbadge">● черновик</span>':''}
        </div>
        <div class="smeta">
          <span>📅 ${fmtD(s.date_from)}</span>
          <span>⏰ ${s.time_dep&&s.time_dep!=='—'?s.time_dep+'→'+(s.time_arr||'?'):'уточнить'}</span>
          <span>⏱ ${s.duration||'—'}</span>
        </div>
      </div>
      <div class="sprice">${fmt(uah)}<div class="orig">${s.price_amount||0} ${sym}</div></div>
      <span class="chev" id="ch${i}">▼</span>
    </div>
    <div class="seg-edit" id="ed${i}">
      <div class="frow">
        <div class="efield"><label>Откуда</label><input value="${s.from_city||''}" onchange="ds(${i},'from_city',this.value)"></div>
        <div class="efield"><label>Куда</label><input value="${s.to_city||''}" onchange="ds(${i},'to_city',this.value)"></div>
      </div>
      <div class="frow">
        <div class="efield"><label>Дата</label><input type="date" value="${s.date_from||''}" onchange="ds(${i},'date_from',this.value)"></div>
        <div class="efield"><label>Выезд</label><input type="time" value="${s.time_dep&&s.time_dep!=='—'?s.time_dep:''}" onchange="ds(${i},'time_dep',this.value||'—')"></div>
        <div class="efield"><label>Прибытие</label><input type="time" value="${s.time_arr&&s.time_arr!=='—'?s.time_arr:''}" onchange="ds(${i},'time_arr',this.value||'—')"></div>
      </div>

      <div class="price-block">
        <label>Стоимость</label>
        <div class="price-inner">
          <input type="number" value="${s.price_amount||0}" min="0" id="pi${i}" onchange="ds(${i},'price_amount',+this.value)">
          <div class="cur-row">
            <button class="cur-btn ${cur==='UAH'?'active':''}" onclick="setCur(${i},'UAH')">₴</button>
            <button class="cur-btn ${cur==='USD'?'active':''}" onclick="setCur(${i},'USD')">$</button>
            <button class="cur-btn ${cur==='EUR'?'active':''}" onclick="setCur(${i},'EUR')">€</button>
          </div>
        </div>
        <div class="price-hint" id="ph${i}">
          ${cur==='UAH'?`${s.price_amount||0} ₴`:cur==='USD'?`${s.price_amount||0} × ${RATES.USD} = ${fmt(uah)}`:`${s.price_amount||0} × ${RATES.EUR} = ${fmt(uah)}`}
        </div>
      </div>

      <div class="frow">
        <div class="efield" style="flex:2"><label>Перевозчик</label><input value="${s.carrier||''}" placeholder="Lufthansa, FlixBus..." onchange="ds(${i},'carrier',this.value)"></div>
        <div class="efield"><label>Длит.</label><input value="${s.duration||''}" placeholder="~4 ч" onchange="ds(${i},'duration',this.value)"></div>
      </div>
      <div class="frow">
        <div class="efield"><label>Адрес отправл.</label><input value="${s.dep_address||''}" placeholder="FRA, Терминал 1" onchange="ds(${i},'dep_address',this.value)"></div>
        <div class="efield"><label>Адрес прибыт.</label><input value="${s.arr_address||''}" placeholder="TLV, Терминал 3" onchange="ds(${i},'arr_address',this.value)"></div>
      </div>
      <div class="efield"><label>Заметка</label><input value="${s.notes||''}" placeholder="доп. информация" onchange="ds(${i},'notes',this.value)"></div>

      <div class="search-btns">
        <div class="search-title">🔎 Найти билеты (откроется в браузере)</div>
        ${linksHTML}
      </div>
      <div class="row-btns">
        <button class="delbtn" onclick="delSeg(${i})">🗑 Удалить</button>
        <button class="sbtn" onclick="saveSeg(${i})">💾 Сохранить</button>
      </div>
    </div>
  </div>`;
  }).join('');
}

function setCur(i,cur){
  ds(i,'price_currency',cur);
  // обновить кнопки валюты без перерисовки
  document.querySelectorAll(`#ed${i} .cur-btn`).forEach(b=>{
    b.classList.toggle('active',
      (cur==='UAH'&&b.textContent==='₴')||(cur==='USD'&&b.textContent==='$')||(cur==='EUR'&&b.textContent==='€'));
  });
}

// Черновик — сохраняет без закрытия панели
function ds(i,k,v){
  const seg=currentSegs[i];
  const upd={...(drafts[seg.id]||{}),[k]:v};
  saveDraft(seg.id,upd);
  // Обновляем только итоги и карточку сегмента
  const s=getSeg(i);
  const uah=toUAH(+s.price_amount||0,s.price_currency||'USD');
  const cur=s.price_currency||'USD';
  // price hint
  const ph=document.getElementById(`ph${i}`);
  if(ph)ph.textContent=cur==='UAH'?`${s.price_amount||0} ₴`:cur==='USD'?`${s.price_amount||0} × ${RATES.USD} = ${fmt(uah)}`:`${s.price_amount||0} × ${RATES.EUR} = ${fmt(uah)}`;
  // заголовок сегмента
  const priceEl=document.querySelector(`#seg-list > div:nth-child(${i+1}) .sprice`);
  if(priceEl)priceEl.innerHTML=`${fmt(uah)}<div class="orig">${s.price_amount||0} ${curSym[cur]||'$'}</div>`;
  const routeEl=document.querySelector(`#seg-list > div:nth-child(${i+1}) .sroute`);
  if(routeEl){
    const pill=routeEl.querySelector('.tpill')?.outerHTML||'';
    routeEl.innerHTML=`${pill}${s.from_city||'?'}<span class="arr">→</span>${s.to_city||'?'}<span class="draftbadge">● черновик</span>`;
  }
  renderBgt();renderTL();renderAlerts();
}

function setType(t,btn){
  newSegType=t;
  document.querySelectorAll('#type-row .type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

async function addSeg(){
  const from=document.getElementById('ns-from').value.trim();
  const to=document.getElementById('ns-to').value.trim();
  const date=document.getElementById('ns-date').value;
  if(!from||!to)return alert('Укажите откуда и куда');
  const {data,error}=await sb.from('segments').insert({
    trip_id:currentTrip.id,user_id:currentUser.id,
    type:newSegType,from_city:from,to_city:to,
    date_from:date,price_amount:0,price_currency:'USD',
    position:currentSegs.length,luggage_ok:true
  }).select().single();
  if(!error){currentSegs.push(data);renderTrip();}
}

function togSeg(i){
  const e=document.getElementById(`ed${i}`),c=document.getElementById(`ch${i}`);
  const was=e.classList.contains('open');
  document.querySelectorAll('.seg-edit').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.chev').forEach(x=>x.classList.remove('open'));
  if(!was){e.classList.add('open');c.classList.add('open');}
}

async function saveSeg(i){
  const seg=currentSegs[i];
  const d=getSeg(i);
  const {error}=await sb.from('segments').update({
    from_city:d.from_city,to_city:d.to_city,
    date_from:d.date_from,time_dep:d.time_dep,time_arr:d.time_arr,
    price_amount:d.price_amount,price_currency:d.price_currency,
    carrier:d.carrier,duration:d.duration,
    notes:d.notes,dep_address:d.dep_address,arr_address:d.arr_address,
  }).eq('id',seg.id);
  if(!error){Object.assign(currentSegs[i],d);clearDraft(seg.id);renderTrip();}
}

async function delSeg(i){
  if(!confirm('Удалить сегмент?'))return;
  clearDraft(currentSegs[i].id);
  await sb.from('segments').delete().eq('id',currentSegs[i].id);
  currentSegs.splice(i,1);renderTrip();
}

function renderAlerts(){
  const a=[];
  if(currentSegs.some((_,i)=>hasDraft(i)))
    a.push({t:'info',txt:'💾 Есть несохранённые изменения. Нажмите «Сохранить» в сегменте когда закончите заполнение.'});
  else if(currentSegs.length>0)
    a.push({t:'ok',txt:'✓ Все сегменты сохранены. Черновики автоматически сохраняются при переходе на другие сайты.'});
  const box=document.getElementById('alerts-box');
  if(box)box.innerHTML=a.map(x=>`<div class="alert ${x.t}">${x.txt}</div>`).join('');
}

function renderTL(){
  const tl=document.getElementById('tl');if(!tl)return;
  if(!currentSegs.length){tl.innerHTML='<div style="color:var(--muted);font-size:11px;padding:4px">Нет сегментов</div>';return;}
  tl.innerHTML=currentSegs.map((seg,i)=>{
    const s=getSeg(i);
    return`<div class="tli">
    <div class="tdc">
      <div class="td ${s.type==='flight'?'flight':''}"></div>
      ${i<currentSegs.length-1?'<div class="tline"></div>':''}
    </div>
    <div class="tco">
      <div class="tdate">${fmtD(s.date_from)}${s.time_dep&&s.time_dep!=='—'?' · '+s.time_dep:''}</div>
      <div class="tlbl">${icons[s.type]} ${s.from_city||'?'} → ${s.to_city||'?'}</div>
      ${s.dep_address?`<div class="tsub">📍 ${s.dep_address}</div>`:''}
      ${s.arr_address?`<div class="tsub">🏁 ${s.arr_address}</div>`:''}
      ${s.carrier?`<div class="tsub">${s.carrier}</div>`:''}
    </div>
  </div>`;
  }).join('');
}

function renderBgt(){
  const bgt=document.getElementById('bgt'),btv=document.getElementById('btotal-val'),th=document.getElementById('trip-total');
  if(!bgt)return;
  let tot=0;
  bgt.innerHTML=currentSegs.map((seg,i)=>{
    const s=getSeg(i);
    const uah=toUAH(+s.price_amount||0,s.price_currency||'USD');
    tot+=uah;
    return`<div class="brow"><span class="lb">${s.from_city||'?'}→${s.to_city||'?'}</span><span class="am">${fmt(uah)}</span></div>`;
  }).join('');
  const ts=fmt(tot);
  if(btv)btv.textContent=ts;
  if(th)th.textContent=ts;
}

init();
</script>
</body>
</html>
