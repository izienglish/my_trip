<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои Поездки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0e0e12;--surface:#16161c;--surface2:#1e1e28;--border:#2a2a38;
  --accent:#f0c040;--accent2:#7c6ff0;--ok:#3dd68c;--warn:#f07850;--danger:#f05060;
  --text:#e8e8f0;--muted:#8888a8;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-text-size-adjust:100%;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;}
.auth-box h1{font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent);margin-bottom:4px;}
.auth-box .sub{color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:24px;}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface2);border-radius:8px;padding:4px;}
.auth-tab{flex:1;padding:9px;border:none;background:none;color:var(--muted);font-family:var(--mono);font-size:12px;border-radius:6px;cursor:pointer;transition:.2s;}
.auth-tab.active{background:var(--accent2);color:#fff;}
.afield{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.afield label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.afield input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:14px;padding:11px 12px;outline:none;width:100%;}
.afield input:focus{border-color:var(--accent2);}
.btn-primary{width:100%;padding:12px;border:none;border-radius:8px;font-family:var(--mono);font-size:13px;cursor:pointer;background:var(--accent2);color:#fff;}
.auth-err{font-size:11px;font-family:var(--mono);margin-top:10px;text-align:center;min-height:16px;color:var(--danger);}

/* HEADER */
.header{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);z-index:200;}
.header h1{font-family:var(--display);font-size:16px;font-weight:800;color:var(--accent);flex:1;}
.rate-badge{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;}
.rate-badge b{color:var(--ok);}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;}
.back-btn{background:none;border:none;color:var(--accent2);font-family:var(--mono);font-size:12px;cursor:pointer;padding:4px 6px;white-space:nowrap;}
.header-total{font-family:var(--mono);font-size:12px;color:var(--ok);white-space:nowrap;}

/* HOME */
.home{padding:16px;}
.home-title{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px;}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;margin-bottom:12px;}
.trip-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.2s;position:relative;}
.trip-card:hover{border-color:var(--accent2);}
.trip-card-name{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-right:80px;}
.trip-card-name h3{font-family:var(--display);font-size:15px;font-weight:700;flex:1;}
.trip-rename-input{font-family:var(--display);font-size:15px;font-weight:700;background:var(--surface2);border:1px solid var(--accent2);border-radius:6px;color:var(--text);padding:3px 7px;outline:none;flex:1;display:none;}
.trip-rename-input.active{display:block;}
.trip-card-name h3.hidden{display:none;}
.trip-meta{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
.trip-price{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ok);margin-top:10px;}
.trip-actions{position:absolute;top:10px;right:10px;display:flex;gap:3px;}
.trip-action-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px;border-radius:4px;transition:.2s;line-height:1;}
.trip-action-btn:hover{color:var(--accent2);background:var(--surface2);}
.trip-action-btn.del:hover{color:var(--danger);}
.add-trip-box{background:var(--surface2);border:2px dashed var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;}
.add-trip-box input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;padding:10px 12px;outline:none;width:100%;}
.add-trip-box input:focus{border-color:var(--accent2);}
.btn-add{background:var(--accent2);color:#fff;border:none;border-radius:8px;padding:11px;font-family:var(--mono);font-size:12px;cursor:pointer;width:100%;}

/* TRIP TABS */
.trip-wrap{display:flex;flex-direction:column;height:calc(100vh - 53px);}
.trip-tabs{display:flex;gap:2px;padding:8px 16px 0;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.trip-tab{padding:8px 14px;border:none;background:none;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;}
.trip-tab.active{color:var(--accent2);border-bottom-color:var(--accent2);}
.trip-content{flex:1;overflow:auto;}

/* TRIP DETAIL */
.trip-detail{display:grid;grid-template-columns:1fr 270px;min-height:100%;}
@media(max-width:680px){.trip-detail{grid-template-columns:1fr;}.sidebar{border-left:none;border-top:1px solid var(--border);}}
.segments{padding:14px 16px;border-right:1px solid var(--border);}
.seg-list{display:flex;flex-direction:column;gap:8px;}
.stitle{font-family:var(--display);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}

/* MAP */
.map-view{padding:14px 16px;}
#trip-map{height:420px;border-radius:10px;border:1px solid var(--border);z-index:1;}
.map-legend{display:flex;gap:12px;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--muted);flex-wrap:wrap;}
.map-legend span{display:flex;align-items:center;gap:4px;}

/* WEATHER */
.weather-view{padding:14px 16px;}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.weather-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;}
.weather-card h4{font-family:var(--display);font-size:12px;font-weight:700;margin-bottom:6px;}
.weather-card .wdate{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:8px;}
.weather-info{display:flex;align-items:center;gap:10px;}
.weather-temp{font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent);}
.weather-desc{font-family:var(--mono);font-size:10px;color:var(--muted);}
.weather-details{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
.weather-loading{color:var(--muted);font-family:var(--mono);font-size:11px;padding:20px;}

/* PACKING LIST */
.pack-view{padding:14px 16px;}
.pack-presets{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.preset-btn{padding:6px 12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:.2s;}
.preset-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.preset-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,111,240,.1);}
.pack-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.pack-cat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;}
.pack-cat h4{font-family:var(--display);font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.pack-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer;}
.pack-item input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent2);cursor:pointer;flex-shrink:0;}
.pack-item.checked span{text-decoration:line-through;color:var(--muted);}
.pack-add{display:flex;gap:6px;margin-top:8px;}
.pack-add input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 8px;outline:none;}
.pack-add button{background:var(--accent2);color:#fff;border:none;border-radius:5px;padding:5px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;}
.pack-progress{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.pack-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.pack-bar-fill{height:100%;background:var(--ok);border-radius:3px;transition:.3s;}
.pack-stat{font-family:var(--mono);font-size:11px;color:var(--muted);}

/* PASTE PARSER */
.paste-view{padding:14px 16px;}
.paste-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.paste-box h3{font-family:var(--display);font-size:13px;font-weight:700;margin-bottom:6px;}
.paste-box p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.paste-textarea{width:100%;height:140px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:11px;padding:10px;outline:none;resize:vertical;line-height:1.5;}
.paste-textarea:focus{border-color:var(--accent2);}
.parse-btn{background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-family:var(--mono);font-size:12px;cursor:pointer;margin-top:8px;}
.parse-result{margin-top:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.parse-field{display:flex;gap:8px;margin-bottom:6px;font-size:12px;font-family:var(--mono);}
.parse-field label{color:var(--muted);min-width:90px;font-size:10px;text-transform:uppercase;}
.parse-field span{color:var(--text);}
.apply-btn{background:var(--ok);color:#000;border:none;border-radius:6px;padding:8px 16px;font-family:var(--mono);font-size:11px;cursor:pointer;margin-top:8px;font-weight:600;}

/* SHARE */
.share-section{padding:10px 11px;}
.share-url{display:flex;gap:6px;margin-top:8px;}
.share-url input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:10px;padding:6px 8px;outline:none;}
.copy-btn{background:var(--accent2);color:#fff;border:none;border-radius:5px;padding:6px 10px;font-family:var(--mono);font-size:10px;cursor:pointer;white-space:nowrap;}
.share-toggle{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.2s;}
.toggle input:checked~.toggle-slider{background:var(--ok);}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle input:checked~.toggle-slider:before{transform:translateX(16px);}

/* SEGMENTS */
.seg{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.2s;}
.seg.draft{border-color:var(--accent);}
.seg-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.sicon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.icon-train{background:rgba(124,111,240,.15);}
.icon-bus{background:rgba(61,214,140,.12);}
.icon-flight{background:rgba(240,192,64,.15);}
.sinfo{flex:1;min-width:0;}
.sroute{font-family:var(--display);font-weight:700;font-size:12px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.arr{color:var(--muted);}
.smeta{margin-top:2px;color:var(--muted);font-size:10px;font-family:var(--mono);display:flex;gap:6px;flex-wrap:wrap;}
.sprice{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ok);text-align:right;flex-shrink:0;}
.sprice .orig{font-size:9px;color:var(--muted);}
.draftbadge{background:rgba(240,192,64,.15);color:var(--accent);border:1px solid rgba(240,192,64,.3);border-radius:3px;padding:1px 4px;font-size:8px;font-family:var(--mono);}
.filebadge{background:rgba(61,214,140,.1);color:var(--ok);border:1px solid rgba(61,214,140,.3);border-radius:3px;padding:1px 4px;font-size:8px;font-family:var(--mono);}
.chev{color:var(--muted);transition:transform .2s;font-size:9px;margin-left:2px;flex-shrink:0;}
.chev.open{transform:rotate(180deg);}
.tpill{font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:3px;font-weight:500;}
.tp-train{background:rgba(124,111,240,.2);color:#a09af0;}
.tp-bus{background:rgba(61,214,140,.15);color:#5dd6a0;}
.tp-flight{background:rgba(240,192,64,.2);color:var(--accent);}
.seg-edit{display:none;border-top:1px solid var(--border);padding:12px;background:var(--surface2);flex-direction:column;gap:9px;}
.seg-edit.open{display:flex;}
.frow{display:flex;gap:7px;flex-wrap:wrap;}
.efield{display:flex;flex-direction:column;gap:3px;flex:1;min-width:85px;}
.efield label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.efield input{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px;outline:none;width:100%;}
.efield input:focus{border-color:var(--accent2);}
.price-block{display:flex;flex-direction:column;gap:5px;}
.price-block label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.price-inner{display:flex;gap:6px;align-items:center;}
.price-inner input{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px;outline:none;flex:1;}
.price-inner input:focus{border-color:var(--accent2);}
.cur-row{display:flex;gap:4px;}
.cur-btn{padding:7px 10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:5px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:.2s;}
.cur-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,111,240,.1);}
.price-hint{font-size:10px;color:var(--ok);font-family:var(--mono);padding:5px 8px;background:rgba(61,214,140,.06);border-radius:5px;border:1px solid rgba(61,214,140,.15);}
.tickets-section{display:flex;flex-direction:column;gap:6px;}
.tickets-label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.ticket-list{display:flex;flex-direction:column;gap:5px;}
.ticket-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;}
.ticket-name{font-family:var(--mono);font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ticket-open{background:none;border:none;color:var(--accent2);font-family:var(--mono);font-size:10px;cursor:pointer;padding:2px 6px;border-radius:4px;white-space:nowrap;}
.ticket-del{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 4px;}
.ticket-del:hover{color:var(--danger);}
.upload-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px dashed var(--border);border-radius:6px;background:none;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;width:100%;transition:.2s;}
.upload-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.upload-progress{font-size:10px;color:var(--ok);font-family:var(--mono);}
.search-btns{display:flex;flex-direction:column;gap:5px;}
.search-title{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.search-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:none;width:100%;transition:.2s;}
.search-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.sb-label{flex:1;text-align:left;}
.sb-arrow{color:var(--muted);}
.row-btns{display:flex;gap:7px;justify-content:space-between;}
.sbtn{background:var(--accent2);color:#fff;border:none;border-radius:5px;padding:8px 14px;font-family:var(--mono);font-size:11px;cursor:pointer;}
.delbtn{background:rgba(240,80,96,.12);color:var(--danger);border:1px solid rgba(240,80,96,.3);border-radius:5px;padding:8px 14px;font-family:var(--mono);font-size:11px;cursor:pointer;}
.add-seg-box{background:var(--surface2);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:8px;}
.seg-type-row{display:flex;gap:5px;margin-bottom:9px;}
.type-btn{flex:1;padding:8px 4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;font-family:var(--mono);font-size:10px;cursor:pointer;text-align:center;transition:.2s;}
.type-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,111,240,.1);}
.cal-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.25);border-radius:8px;color:var(--ok);font-family:var(--mono);font-size:12px;cursor:pointer;transition:.2s;}
.cal-btn:hover{background:rgba(61,214,140,.14);}
.alerts{padding:8px 16px 4px;}
.alert{display:flex;align-items:flex-start;gap:6px;padding:7px 10px;border-radius:7px;margin-bottom:5px;font-size:11px;font-family:var(--mono);line-height:1.5;}
.alert.info{background:rgba(124,111,240,.08);border:1px solid rgba(124,111,240,.25);color:#a09af0;}
.alert.ok{background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.2);color:var(--ok);}

/* SIDEBAR */
.sidebar{padding:14px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.sc h3{padding:8px 11px;font-family:var(--display);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
.bgt{padding:7px 11px;}
.brow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:10px;}
.brow:last-child{border-bottom:none;}
.brow .lb{color:var(--muted);font-family:var(--mono);font-size:9px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brow .am{font-family:var(--mono);color:var(--text);}
.btotal{display:flex;justify-content:space-between;align-items:baseline;padding:8px 11px;border-top:2px solid var(--border);font-family:var(--display);font-weight:700;font-size:11px;}
.btotal .am{color:var(--accent);font-size:15px;}
.tl{padding:8px 11px;display:flex;flex-direction:column;}
.tli{display:flex;gap:8px;padding-bottom:9px;}
.tli:last-child{padding-bottom:0;}
.tdc{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0;}
.td{width:8px;height:8px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);margin-top:2px;flex-shrink:0;}
.td.flight{background:var(--accent);}
.tline{flex:1;width:1px;background:var(--border);margin-top:2px;}
.tco{flex:1;}
.tdate{font-family:var(--mono);font-size:9px;color:var(--muted);}
.tlbl{font-size:11px;font-weight:500;margin-top:1px;}
.tsub{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:1px;}

// ── ICS ──
function buildICS(){
  const segs=currentSegs.map((s,i)=>getSeg(i)).filter(s=>s.date_from);
  if(!segs.length)return null;
  function toAsciiSummary(s){
    const m={train:'Train',bus:'Bus',flight:'Flight'};
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let ds='';if(s.date_from){const[,mo,d]=s.date_from.split('-');ds=` (${+d} ${months[+mo-1]})`;}
    return`${m[s.type]||s.type}: ${s.from_city||'?'} - ${s.to_city||'?'}${ds}`;
  }
  function esc(str){if(!str)return'';return str.replace(/https?:\/\/\S+/g,'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n').trim();}
  function fold(line){const enc=new TextEncoder();if(enc.encode(line).length<=75)return line;const chars=[...line];const out=[];let cur='';let cb=0;let first=true;for(const ch of chars){const cl=enc.encode(ch).length;if(cb+cl>(first?75:74)){out.push(cur);cur=(first?'':' ')+ch;cb=(first?0:1)+cl;first=false;}else{cur+=ch;cb+=cl;}}if(cur)out.push(cur);return out.join('\r\n ');}
  function dtOnly(d){return d.replace(/-/g,'');}
  function dtTime(date,time){if(!time||time==='—'||time==='')return null;return date.replace(/-/g,'')+`T${time.replace(':','')}00`;}
  function nextDay(d){const dt=new Date(d);dt.setDate(dt.getDate()+1);return dt.toISOString().slice(0,10).replace(/-/g,'');}
  const now=new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MyTrip//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  segs.forEach((s,i)=>{
    const hasD=s.time_dep&&s.time_dep!=='—'&&s.time_dep!=='';
    const hasA=s.time_arr&&s.time_arr!=='—'&&s.time_arr!=='';
    let dtstart,dtend,allDay=false;
    if(hasD){
      dtstart=dtTime(s.date_from,s.time_dep);
      if(hasA){const ad=s.time_arr<s.time_dep?nextDay(s.date_from):s.date_from;dtend=dtTime(ad,s.time_arr);}
      else{const[h,m]=(s.time_dep).split(':').map(Number);const eh=String((h+2)%24).padStart(2,'0');const em=String(m).padStart(2,'0');dtend=dtTime(s.date_from,`${eh}:${em}`);}
    }else{allDay=true;dtstart=dtOnly(s.date_from);dtend=nextDay(s.date_from);}
    const desc=[s.carrier&&`Carrier: ${s.carrier}`,s.duration&&`Duration: ${s.duration}`,s.dep_address&&`From: ${s.dep_address}`,s.arr_address&&`To: ${s.arr_address}`,s.price_amount&&`Price: ${s.price_amount} ${s.price_currency||'USD'}`].filter(Boolean);
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:seg${i}-${currentTrip.id.replace(/-/g,'').slice(0,12)}@mytrip`);
    lines.push(`DTSTAMP:${now}`);
    lines.push(allDay?`DTSTART;VALUE=DATE:${dtstart}`:`DTSTART:${dtstart}`);
    lines.push(allDay?`DTEND;VALUE=DATE:${dtend}`:`DTEND:${dtend}`);
    lines.push(`SUMMARY:${esc(toAsciiSummary(s))}`);
    if(desc.length)lines.push(`DESCRIPTION:${esc(desc.join(' | '))}`);
    if(s.dep_address)lines.push(`LOCATION:${esc(s.dep_address)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n');
}

function exportToCalendar(){
  const content=buildICS();if(!content){alert('Нет сегментов с датами!');return;}
  const blob=new Blob([content],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`${(currentTrip.name||'trip').replace(/[^a-zA-Z0-9_-]/g,'_')}.ics`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function gcalUrl(s){
  const hasD=s.time_dep&&s.time_dep!=='—'&&s.time_dep!=='';
  const hasA=s.time_arr&&s.time_arr!=='—'&&s.time_arr!=='';
  const names={train:'Поезд',bus:'Автобус',flight:'Рейс'};
  const title=`${names[s.type]||s.type}: ${s.from_city||'?'} - ${s.to_city||'?'}`;
  let dates;
  if(hasD){
    const dStr=s.date_from.replace(/-/g,'');const tDep=s.time_dep.replace(':','')+'00';
    let arrDate=s.date_from;
    if(hasA&&s.time_arr<s.time_dep){const dt=new Date(s.date_from);dt.setDate(dt.getDate()+1);arrDate=dt.toISOString().slice(0,10);}
    const tArr=hasA?(s.time_arr.replace(':','')+'00'):(()=>{const[h,m]=s.time_dep.split(':').map(Number);return String((h+2)%24).padStart(2,'0')+String(m).padStart(2,'0')+'00';})();
    dates=`${dStr}T${tDep}/${arrDate.replace(/-/g,'')}T${tArr}`;
  }else{const d=(s.date_from||'20260101').replace(/-/g,'');dates=`${d}/${d}`;}
  const details=[s.carrier&&`Перевозчик: ${s.carrier}`,s.duration&&`Длительность: ${s.duration}`,s.price_amount&&`Стоимость: ${s.price_amount} ${s.price_currency||'USD'}`].filter(Boolean).join('\n');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${encodeURIComponent(dates)}&details=${encodeURIComponent(details)}&location=${encodeURIComponent(s.dep_address||'')}`;
}

      <span style="color:var(--accent2)">+ добавить ↗</span>
    </a>`).join('');
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;">
    <div style="font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:6px;">Добавить в Google Calendar</div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:14px;">Нажмите на каждый сегмент — откроется Google Calendar с заполненными данными. Нажмите "Сохранить" в каждом.</div>
    ${linksHTML}
    <button onclick="this.closest('div').parentNode.remove()" style="width:100%;padding:9px;border:1px solid var(--border);background:none;color:var(--muted);border-radius:7px;font-family:var(--mono);font-size:11px;cursor:pointer;margin-top:4px;">Закрыть</button>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
}

function triggerUpload(segIdx){uploadingSegIdx=segIdx;document.getElementById('file-input').click();}
async function handleFileUpload(event){
  const file=event.target.files[0];if(!file||uploadingSegIdx===null)return;event.target.value='';
  const i=uploadingSegIdx;const seg=currentSegs[i];
  const ext=file.name.split('.').pop();const path=`${currentUser.id}/${seg.id}/${Date.now()}.${ext}`;
  const pb=document.getElementById(`upload-prog-${i}`);if(pb)pb.textContent='⏳ Загрузка...';
  const {error}=await sb.storage.from('tickets').upload(path,file);
  if(error){if(pb)pb.textContent='❌ Ошибка: '+error.message;return;}
  const files=Array.isArray(seg.ticket_files)?[...seg.ticket_files]:[];
  files.push({name:file.name,path,type:file.type});
  const {error:e2}=await sb.from('segments').update({ticket_files:files}).eq('id',seg.id);
  if(!e2){currentSegs[i].ticket_files=files;clearDraft(seg.id);renderTrip();setTimeout(()=>{const e=document.getElementById(`ed${i}`),c=document.getElementById(`ch${i}`);if(e){e.classList.add('open');if(c)c.classList.add('open');}},50);}
}
async function openTicket(path){const {data}=await sb.storage.from('tickets').createSignedUrl(path,3600);if(data?.signedUrl)window.open(data.signedUrl,'_blank');}
async function deleteTicket(si,fi){
  if(!confirm('Удалить файл?'))return;
  const seg=currentSegs[si];const files=[...(Array.isArray(seg.ticket_files)?seg.ticket_files:[])];
  await sb.storage.from('tickets').remove([files[fi].path]);files.splice(fi,1);
  await sb.from('segments').update({ticket_files:files}).eq('id',seg.id);
  currentSegs[si].ticket_files=files;renderTrip();setTimeout(()=>{const e=document.getElementById(`ed${si}`),c=document.getElementById(`ch${si}`);if(e){e.classList.add('open');if(c)c.classList.add('open');}},50);
}

async function duplicateTrip(id,name,event){
  event.stopPropagation();const newName=prompt('Название копии:',name+' (копия)');if(!newName)return;
  const {data:newTrip}=await sb.from('trips').insert({name:newName,user_id:currentUser.id}).select().single();if(!newTrip)return;

async function toggleShare(tripId,checked){
  let token=currentTrip.share_token;
  if(checked&&!token){token=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);currentTrip.share_token=token;}
  await sb.from('trips').update({is_public:checked,share_token:token||null}).eq('id',tripId);

function renderShareSection(){
  const el=document.getElementById('share-section');if(!el)return;

  const shareUrl=token?`${location.origin}${location.pathname}?share=${token}`:'';
  el.innerHTML=`
    <div class="share-toggle">

function copyShare(){

// ── MAP ──
function renderMap(){
  // Works for both trip detail tab and public share page
  const el=document.getElementById('map-view-content');
  // If no map-view-content but trip-map exists (public page), proceed directly
  const mapDiv=document.getElementById('trip-map');
  if(!mapDiv)return;
  const points=currentSegs.map((s,i)=>{const d=getSeg(i);return{from:d.from_city,to:d.to_city,type:d.type};});
  const coords=[];
  points.forEach(p=>{
    const fc=getCityCoords(p.from);const tc=getCityCoords(p.to);
    if(fc)coords.push({name:p.from,lat:fc[0],lng:fc[1],type:p.type});
    if(tc)coords.push({name:p.to,lat:tc[0],lng:tc[1],type:p.type});
  });
  // Deduplicate
  const seen=new Set();const unique=coords.filter(c=>{const k=`${c.lat},${c.lng}`;if(seen.has(k))return false;seen.add(k);return true;});

  if(!unique.length){el.innerHTML='<div style="color:var(--muted);font-family:var(--mono);font-size:11px;padding:20px">Нет городов с известными координатами. Добавьте сегменты с городами из списка.</div>';return;}

  // Render map directly (no setTimeout wrapper needed, Leaflet already loaded)
  if(mapInstance){try{mapInstance.remove();}catch(e){}mapInstance=null;}
  const map=L.map('trip-map',{zoomControl:true});
  mapInstance=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  const latlngs=unique.map(c=>[c.lat,c.lng]);
  if(latlngs.length>1)L.polyline(latlngs,{color:'#7c6ff0',weight:2,dashArray:'5,5',opacity:0.8}).addTo(map);
  unique.forEach((c,i)=>{
    const color=i===0?'#3dd68c':i===unique.length-1?'#f05060':'#7c6ff0';
    const icon=L.divIcon({html:`<div style="background:${color};width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,iconSize:[10,10],iconAnchor:[5,5],className:''});
    L.marker([c.lat,c.lng],{icon}).addTo(map).bindPopup(`<b>${c.name}</b>`);
  });
  map.fitBounds(latlngs,{padding:[30,30]});
}

const WMO={0:'Ясно',1:'Преимущественно ясно',2:'Переменная облачность',3:'Пасмурно',45:'Туман',48:'Изморозь',51:'Лёгкий дождь',53:'Умеренный дождь',55:'Сильный дождь',61:'Небольшой дождь',63:'Умеренный дождь',65:'Сильный дождь',71:'Лёгкий снег',73:'Умеренный снег',75:'Сильный снег',80:'Ливень',81:'Умеренный ливень',82:'Сильный ливень',95:'Гроза',96:'Гроза с градом',99:'Сильная гроза'};
const WMO_ICON={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌦',63:'🌧',65:'🌧',71:'🌨',73:'🌨',75:'❄️',80:'🌧',81:'🌧',82:'⛈',95:'⛈',96:'⛈',99:'⛈'};

async function renderWeather(){
  const el=document.getElementById('weather-view-content');if(!el)return;
  el.innerHTML='<div class="weather-loading">⏳ Загрузка прогноза погоды...</div>';
  const segData=currentSegs.map((s,i)=>getSeg(i)).filter(s=>s.date_from&&getCityCoords(s.to_city));
  if(!segData.length){el.innerHTML='<div class="weather-loading">Нет городов с известными координатами для прогноза.</div>';return;}

  const cards=await Promise.all(segData.map(async s=>{
    const coords=getCityCoords(s.to_city);
    const [lat,lon]=coords;
    const date=s.date_from;
    // Check if date is within 16 days
    const diff=(new Date(date)-new Date())/(1000*60*60*24);
    if(diff>16||diff<-1)return`<div class="weather-card"><h4>${s.to_city||'?'}</h4><div class="wdate">${fmtD(date)}</div><div class="weather-desc">Прогноз доступен за 16 дней до даты</div></div>`;
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum,windspeed_10m_max&start_date=${date}&end_date=${date}&timezone=auto`;
      const r=await fetch(url);const d=await r.json();
      if(!d.daily||!d.daily.time?.length)throw new Error('no data');
      const code=d.daily.weathercode[0]||0;
      const tmax=Math.round(d.daily.temperature_2m_max[0]);
      const tmin=Math.round(d.daily.temperature_2m_min[0]);
      const prec=d.daily.precipitation_sum[0];
      const wind=Math.round(d.daily.windspeed_10m_max[0]);
      const icon=WMO_ICON[code]||'🌡';
      const desc=WMO[code]||'—';
      return`<div class="weather-card">
        <h4>${s.to_city}</h4>
        <div class="wdate">${fmtD(date)}</div>
        <div class="weather-info">
          <span style="font-size:28px">${icon}</span>
          <div>
            <div class="weather-temp">${tmax}°</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <div class="weather-details">
          <span>🌡 ${tmin}°–${tmax}°</span>
          <span>💧 ${prec}мм</span>
          <span>💨 ${wind}км/ч</span>
        </div>
      </div>`;
    }catch(e){return`<div class="weather-card"><h4>${s.to_city||'?'}</h4><div class="wdate">${fmtD(date)}</div><div class="weather-desc">Ошибка загрузки прогноза</div></div>`;}
  }));
  el.innerHTML=`<div class="weather-grid">${cards.join('')}</div>`;
}

// ── PACKING LIST ──
function renderPackList(){
  const el=document.getElementById('pack-view-content');if(!el)return;
  if(!packItems[activePreset])packItems[activePreset]={};
  const preset=PACK_PRESETS[activePreset]||PACK_PRESETS.city;
  let total=0,checked=0;
  Object.entries(preset).forEach(([cat,items])=>{
    items.forEach(item=>{total++;if(packItems[activePreset]?.[cat]?.[item])checked++;});
    // Custom items
    const custom=packItems[activePreset]?.[cat]?.['__custom']||[];
    custom.forEach(()=>{total++;if(packItems[activePreset]?.[cat]?.['__customChecked']?.[custom.indexOf])checked++;});
  });

  const progress=total>0?Math.round(checked/total*100):0;

  const cats=Object.entries(preset).map(([cat,items])=>{
    const custom=packItems[activePreset]?.[cat]?.['__custom']||[];
    const allItems=[...items,...custom];
    const itemsHTML=allItems.map(item=>{
      const isChecked=!!(packItems[activePreset]?.[cat]?.[item]);
      return`<label class="pack-item ${isChecked?'checked':''}">
        <input type="checkbox" ${isChecked?'checked':''} onchange="togglePackItem('${cat}','${item.replace(/'/g,"\\'")}',this.checked)">
        <span>${item}</span>
      </label>`;
    }).join('');
    return`<div class="pack-cat">
      <h4>${cat}</h4>
      ${itemsHTML}
      <div class="pack-add">
        <input type="text" placeholder="Добавить..." id="custom-${cat.replace(/\s/g,'_')}">
        <button onclick="addCustomItem('${cat}')">+</button>
      </div>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="pack-presets">
      <button class="preset-btn ${activePreset==='city'?'active':''}" onclick="setPreset('city')">🏙 Город</button>
      <button class="preset-btn ${activePreset==='beach'?'active':''}" onclick="setPreset('beach')">🏖 Пляж</button>
      <button class="preset-btn ${activePreset==='business'?'active':''}" onclick="setPreset('business')">💼 Бизнес</button>
      <button class="preset-btn ${activePreset==='hike'?'active':''}" onclick="setPreset('hike')">🏔 Поход</button>
    </div>
    <div class="pack-progress">
      <div class="pack-bar"><div class="pack-bar-fill" style="width:${progress}%"></div></div>
      <span class="pack-stat">${checked}/${total} собрано</span>
    </div>
    <div class="pack-cats">${cats}</div>`;
}

function setPreset(p){activePreset=p;renderPackList();}

function togglePackItem(cat,item,val){
  if(!packItems[activePreset])packItems[activePreset]={};
  if(!packItems[activePreset][cat])packItems[activePreset][cat]={};
  packItems[activePreset][cat][item]=val;
  savePackItems(currentTrip.id);
  renderPackList();
}

function addCustomItem(cat){
  const inp=document.getElementById(`custom-${cat.replace(/\s/g,'_')}`);
  if(!inp||!inp.value.trim())return;
  const item=inp.value.trim();
  if(!packItems[activePreset])packItems[activePreset]={};
  if(!packItems[activePreset][cat])packItems[activePreset][cat]={};
  if(!packItems[activePreset][cat]['__custom'])packItems[activePreset][cat]['__custom']=[];
  packItems[activePreset][cat]['__custom'].push(item);
  savePackItems(currentTrip.id);
  renderPackList();
}

// ── PASTE PARSER ──
function parsePaste(){
  const text=document.getElementById('paste-input').value;
  if(!text.trim()){alert('Вставьте текст письма');return;}
  try{localStorage.setItem('paste_draft_'+currentTrip?.id,text);}catch(e){}
  const result={type:'flight',from:'',to:'',date:'',timeDep:'',timeArr:'',carrier:'',price:''};

  // 1. TYPE — check flight number first (strongest signal)
  const hasFlightNum=/\b[A-Z]{2}\s*\d{3,4}\b/.test(text);
  const hasAirport=/\b(WAW|FRA|KBP|TLV|RMO|IST|ATH|FCO|CDG|LHR|MAD|BCN|BER|VIE|PRG|BUD|LWO|ODS|HRK|AMS|DXB|MUC|DUS|LTN|STN|CIA|BGY|WMI|KRK|GDN|POZ|WRO|LCJ|SXF)\b/.test(text);
  if(hasFlightNum||hasAirport)result.type='flight';
  else if(/поїзд|поезд|\bтrain\b|залізниця|\bpkp\b|вагон|купе|плацкарт/i.test(text))result.type='train';
  else if(/\bавтобус\b|\bbus\b|flixbus|ecolines/i.test(text))result.type='bus';
  else result.type='flight';

  // 2. DATE — multiple formats
  const MONTHS={'янв':'01','jan':'01','лют':'02','фев':'02','feb':'02','бер':'03','мар':'03','mar':'03','кві':'04','апр':'04','apr':'04','тра':'05','май':'05','мая':'05','may':'05','чер':'06','июн':'06','июня':'06','jun':'06','чрв':'06','лип':'07','июл':'07','июля':'07','jul':'07','сер':'08','авг':'08','aug':'08','вер':'09','сен':'09','sep':'09','жов':'10','окт':'10','oct':'10','лис':'11','ноя':'11','nov':'11','гру':'12','дек':'12','dec':'12'};
  // ISO
  const isoD=text.match(/\b(202\d)-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])\b/);
  if(isoD){result.date=isoD[0];}
  else {
    // DD.MM.YYYY
    const dmy=text.match(/\b(0?[1-9]|[12]\d|3[01])\.(0?[1-9]|1[0-2])\.(202\d)\b/);
    if(dmy){result.date=`${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`;}
    else {
      // "вс, 21 июн." or "21 июня" or "21 чер"
      const ruD=text.match(/(?:пн|вт|ср|чт|пт|сб|вс|пн\.|вт\.|ср\.|чт\.|пт\.|сб\.|вс\.)?[,\s]*(\d{1,2})\s+(янв|лют|фев|бер|мар|кві|апр|тра|май|мая|чер|июн|июня|чрв|лип|июл|июля|сер|авг|вер|сен|жов|окт|лис|ноя|гру|дек|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\.?(?:\s+(202\d))?/i);
      if(ruD){
        const d=ruD[1].padStart(2,'0');
        const mk=ruD[2].toLowerCase().slice(0,3);
        const m=MONTHS[mk]||'01';
        const y=ruD[3]||'2026';
        result.date=`${y}-${m}-${d}`;
      }
    }
  }

  // 3. TIMES — remove phone numbers first
  const noPhones=text.replace(/\+?[\d][\d\s\-\(\)]{8,}/g,' ');
  const timeRe=/\b([01]?\d|2[0-3]):([0-5]\d)\b/g;
  const allTimes=[];let tm;
  while((tm=timeRe.exec(noPhones))!==null)allTimes.push(tm[0]);
  const uniqTimes=[...new Set(allTimes)];
  if(uniqTimes.length>=1)result.timeDep=uniqTimes[0];
  if(uniqTimes.length>=2)result.timeArr=uniqTimes[1];

  // 4. FROM/TO
  // Pattern: "Варшава – Франкфурт" or "Варшава → Франкфурт"
  // Use lines to avoid multiline pollution
  const badWords=/затримк|скасуванн|хвороб|повернен|реєстрац|підтримк|support|cancel|delay|refund|захист|гарант|швидк/i;
  for(const line of text.split(/\n/)){
    const m=line.match(/^([А-ЯЄІЇA-ZÀ-Ö][а-яєіїёa-zà-ö\s]{1,20})\s*[–—→\-]\s*([А-ЯЄІЇA-ZÀ-Ö][а-яєіїёa-zà-ö\s]{1,20})$/);
    if(m&&!badWords.test(m[1])&&!badWords.test(m[2])){
      result.from=m[1].trim();result.to=m[2].trim();break;
    }
  }
  // Airport codes fallback
  const AP={'WAW':'Варшава','KRK':'Краков','FRA':'Франкфурт','MUC':'Мюнхен','BER':'Берлин','VIE':'Вена','PRG':'Прага','BUD':'Будапешт','KBP':'Киев','IEV':'Киев','ODS':'Одесса','HRK':'Харьков','LWO':'Львов','TLV':'Тель-Авив','RMO':'Кишинёв','KIV':'Кишинёв','IST':'Стамбул','SAW':'Стамбул','ATH':'Афины','FCO':'Рим','CDG':'Париж','LHR':'Лондон','MAD':'Мадрид','BCN':'Барселона','AMS':'Амстердам','DXB':'Дубай','BKK':'Бангкок'};
  if(!result.from||!result.to){
    const codes=[...text.matchAll(/\b([A-Z]{3})\b/g)].map(m=>m[1]).filter(c=>AP[c]);
    if(codes.length>=1&&!result.from)result.from=AP[codes[0]];
    if(codes.length>=2&&!result.to)result.to=AP[codes[1]];
  }

  // 5. CARRIER
  const airlines=['Lufthansa','Ryanair','Wizz Air','WizzAir','Ukraine International','UIA','Aegean','El Al','FlyOne','HiSky','SkyUp','FlixBus','Flixbus','Ecolines','PKP','Укрзалізниця','Мау'];
  for(const a of airlines){if(text.includes(a)){result.carrier=a;break;}}
  if(!result.carrier){
    const fn=text.match(/\b([A-Z]{2})\s*(\d{3,4})\b/);
    if(fn)result.carrier=fn[0];
  }

  // 6. PRICE
  const pm=text.match(/(\d[\d\s]*[,.]?\d*)\s*(грн|uah|₴|€|eur|\$|usd)/i);
  if(pm)result.price=pm[1].replace(/\s/g,'');

  parseResult=result;
  document.getElementById('parse-result').innerHTML=`
    <div class="parse-field"><label>Тип</label><span>${TL[result.type]||result.type}</span></div>
    <div class="parse-field"><label>Откуда</label><span>${result.from||'—'}</span></div>
    <div class="parse-field"><label>Куда</label><span>${result.to||'—'}</span></div>
    <div class="parse-field"><label>Дата</label><span>${result.date||'—'}</span></div>
    <div class="parse-field"><label>Выезд</label><span>${result.timeDep||'—'}</span></div>
    <div class="parse-field"><label>Прибытие</label><span>${result.timeArr||'—'}</span></div>
    <div class="parse-field"><label>Перевозчик</label><span>${result.carrier||'—'}</span></div>
    <div class="parse-field"><label>Цена</label><span>${result.price||'—'}</span></div>
    <button class="apply-btn" onclick="applyParse()">✓ Создать сегмент из этих данных</button>`;
}

async function applyParse(){
  if(!parseResult)return;
  const{type,from,to,date,timeDep,timeArr,carrier,price}=parseResult;
  const {data,error}=await sb.from('segments').insert({
    trip_id:currentTrip.id,user_id:currentUser.id,
    type,from_city:from,to_city:to,date_from:date,
    time_dep:timeDep||null,time_arr:timeArr||null,
    carrier,price_amount:+price||0,price_currency:'UAH',
    position:currentSegs.length,luggage_ok:true,ticket_files:[]
  }).select().single();
  if(!error){
    currentSegs.push(data);
    alert('Сегмент создан! Перейдите на вкладку "Маршрут" для проверки.');
    document.getElementById('paste-input').value='';
    document.getElementById('parse-result').innerHTML='';
    parseResult=null;
  }
}

// ── INIT ──
async function init(){
  showLoading();fetchRates();
  // Check public share
  const params=new URLSearchParams(location.search);
  const shareToken=params.get('share');
  if(shareToken){await showPublicTrip(shareToken);return;}
  const {data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user;const nav=loadNav();if(nav?.tripId)await restoreTrip(nav.tripId,nav.tripName,nav.openSegIdx,nav.activeTab);else showHome();}
  else showAuth();
  sb.auth.onAuthStateChange((_,s)=>{
    if(s){
      // If user changed — clear ALL navigation state from previous session
      const prevUserId=localStorage.getItem('current_user_id');
      if(prevUserId && prevUserId!==s.user.id){
        // Different user — clear everything
        clearNav();
        try{
          // Clear all drafts and pack items from other users
          Object.keys(localStorage).forEach(k=>{
            if(k.startsWith('d_')||k.startsWith('pack_')||k.startsWith('paste_draft_')){
              localStorage.removeItem(k);
            }
          });
        }catch(e){}
      }
      localStorage.setItem('current_user_id',s.user.id);
      currentUser=s.user;
      const nav=loadNav();
      // Extra safety: verify the trip belongs to this user before restoring
      if(nav?.tripId){
        restoreTrip(nav.tripId,nav.tripName,nav.openSegIdx,nav.activeTab);
      }else{
        showHome();
      }
    }
    else{currentUser=null;clearNav();localStorage.removeItem('current_user_id');showAuth();}
  });
}

              <div class="smeta">
                <span>📅 ${fmtD(s.date_from)}</span>
                <span>⏰ ${s.time_dep&&s.time_dep!=='—'?s.time_dep+'->'+(s.time_arr||'?'):'уточнить'}</span>
                ${s.carrier?`<span>${s.carrier}</span>`:''}
                ${s.dep_address?`<span>📍 ${s.dep_address}</span>`:''}
              </div>
            </div>
            <div class="sprice">${fmt(toUAH(+s.price_amount||0,s.price_currency||'USD'))}</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="stitle" style="margin-bottom:10px">Карта маршрута</div>
      <div id="trip-map" style="height:380px;border-radius:10px;border:1px solid var(--border);"></div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:8px;display:flex;gap:14px">
        <span>🟢 Начало</span><span>🔵 Промежуточные</span><span>🔴 Конец</span>
      </div>
    </div>`;
  // Load Leaflet dynamically if not yet available
  function tryRenderMap(attempts){
    if(window.L&&window.L.map){
      renderMap();
    } else if(attempts>0){
      setTimeout(()=>tryRenderMap(attempts-1),300);
    } else {
      // Force load Leaflet
      if(!document.querySelector('script[src*="leaflet"]')){
        const s=document.createElement('script');
        s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        s.onload=()=>setTimeout(renderMap,100);
        document.head.appendChild(s);
      }
    }
  }
  setTimeout(()=>tryRenderMap(15),500);
}

async function restoreTrip(id,name,segIdx,tab){
  // Security check: verify this trip belongs to current user
  const {data:ownerCheck}=await sb.from('trips').select('id,user_id,share_token,is_public').eq('id',id).eq('user_id',currentUser.id).single();
  if(!ownerCheck){
    // Trip doesn't belong to this user — clear nav and go home
    clearNav();showHome();return;
  }
  currentTrip={id,name,share_token:ownerCheck.share_token,is_public:ownerCheck.is_public};
  loadDrafts(id);loadPackItems(id);
  activeTab=tab||'segments';
  const {data}=await sb.from('segments').select('*').eq('trip_id',id).order('position');
  currentSegs=data||[];openSegIdx=segIdx;
  renderTrip();
  if(segIdx!=null)setTimeout(()=>{const e=document.getElementById(`ed${segIdx}`),c=document.getElementById(`ch${segIdx}`);if(e){e.classList.add('open');if(c)c.classList.add('open');}},100);
  if(activeTab==='map')setTimeout(renderMap,200);
  if(activeTab==='weather')setTimeout(renderWeather,200);
  if(activeTab==='packing')setTimeout(renderPackList,100);
}

async function openTrip(id,name){

function renderSegList(){

    const hasNextDay=s.time_arr&&s.time_arr!=='—'&&s.time_dep&&s.time_dep!=='—'&&s.time_arr<s.time_dep&&s.date_from;
    const nextDayDate=hasNextDay?(()=>{const dt=new Date(s.date_from);dt.setDate(dt.getDate()+1);return fmtD(dt.toISOString().slice(0,10));})():'';

      </div>
      <div class="price-block"><label>Стоимость</label><div class="price-inner"><input type="number" value="${s.price_amount||s.price_usd||0}" min="0" onchange="ds(${i},'price_amount',+this.value)"><div class="cur-row"><button class="cur-btn ${cur==='UAH'?'active':''}" onclick="setCur(${i},'UAH')">₴</button><button class="cur-btn ${cur==='USD'?'active':''}" onclick="setCur(${i},'USD')">$</button><button class="cur-btn ${cur==='EUR'?'active':''}" onclick="setCur(${i},'EUR')">€</button></div></div><div class="price-hint" id="ph${i}">${phint}</div></div>

function togSeg(i){
  const e=document.getElementById(`ed${i}`),c=document.getElementById(`ch${i}`);
  const was=e.classList.contains('open');
  document.querySelectorAll('.seg-edit').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.chev').forEach(x=>x.classList.remove('open'));
  if(!was){e.classList.add('open');c.classList.add('open');openSegIdx=i;}else openSegIdx=null;
  saveNav();
}

function setCur(i,cur){
  ds(i,'price_currency',cur);
  document.querySelectorAll(`#ed${i} .cur-btn`).forEach(b=>{b.classList.toggle('active',(cur==='UAH'&&b.textContent==='₴')||(cur==='USD'&&b.textContent==='$')||(cur==='EUR'&&b.textContent==='€'));});
}

function ds(i,k,v){
  const seg=currentSegs[i];const upd={...(drafts[seg.id]||{}),[k]:v};saveDraft(seg.id,upd);
  const s=getSeg(i);const uah=toUAH(+s.price_amount||+s.price_usd||0,s.price_currency||'USD');const cur=s.price_currency||'USD';
  const ph=document.getElementById(`ph${i}`);if(ph)ph.textContent=cur==='UAH'?`${s.price_amount||0} ₴`:cur==='USD'?`${s.price_amount||0} × ${RATES.USD} = ${fmt(uah)}`:`${s.price_amount||0} × ${RATES.EUR} = ${fmt(uah)}`;
  const pe=document.querySelector(`#seg-list > div:nth-child(${i+1}) .sprice`);if(pe)pe.innerHTML=`${fmt(uah)}<div class="orig">${s.price_amount||0}${CS[cur]||'$'}</div>`;
  const re=document.querySelector(`#seg-list > div:nth-child(${i+1}) .sroute`);if(re){const pill=re.querySelector('.tpill')?.outerHTML||'';re.innerHTML=`${pill}${s.from_city||'?'}<span class="arr">→</span>${s.to_city||'?'}<span class="draftbadge">● черновик</span>`;}
  renderBgt();renderTL();renderAlerts();
}

function setType(t,btn){newSegType=t;document.querySelectorAll('#type-row .type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

async function addSeg(){
  const from=document.getElementById('ns-from').value.trim();const to=document.getElementById('ns-to').value.trim();const date=document.getElementById('ns-date').value;
  if(!from||!to)return alert('Укажите откуда и куда');
  const {data,error}=await sb.from('segments').insert({trip_id:currentTrip.id,user_id:currentUser.id,type:newSegType,from_city:from,to_city:to,date_from:date,price_amount:0,price_currency:'USD',position:currentSegs.length,luggage_ok:true,ticket_files:[]}).select().single();
  if(!error){currentSegs.push(data);renderTrip();}
}

async function saveSeg(i){
  const seg=currentSegs[i];const d=getSeg(i);
  const {error}=await sb.from('segments').update({from_city:d.from_city,to_city:d.to_city,date_from:d.date_from,time_dep:d.time_dep,time_arr:d.time_arr,price_amount:d.price_amount,price_currency:d.price_currency,carrier:d.carrier,duration:d.duration,notes:d.notes,dep_address:d.dep_address,arr_address:d.arr_address}).eq('id',seg.id);
  if(!error){Object.assign(currentSegs[i],d);clearDraft(seg.id);openSegIdx=null;saveNav();renderTrip();}
}

async function delSeg(i){
  if(!confirm('Удалить сегмент?'))return;clearDraft(currentSegs[i].id);
  await sb.from('segments').delete().eq('id',currentSegs[i].id);currentSegs.splice(i,1);openSegIdx=null;saveNav();renderTrip();
}

function renderAlerts(){
  const a=[];
  if(currentSegs.some((_,i)=>hasDraft(i)))a.push({t:'info',txt:'💾 Есть несохранённые изменения. Нажмите «Сохранить» когда закончите.'});
  else if(currentSegs.length>0)a.push({t:'ok',txt:'✓ Все сохранено. При переходе на другой сайт страница восстановится автоматически.'});
  const box=document.getElementById('alerts-box');if(box)box.innerHTML=a.map(x=>`<div class="alert ${x.t}">${x.txt}</div>`).join('');
}

function renderTL(){
  const tl=document.getElementById('tl');if(!tl)return;
  if(!currentSegs.length){tl.innerHTML='<div style="color:var(--muted);font-size:11px;padding:4px">Нет сегментов</div>';return;}
  tl.innerHTML=currentSegs.map((seg,i)=>{const s=getSeg(i);return`<div class="tli"><div class="tdc"><div class="td ${s.type==='flight'?'flight':''}"></div>${i<currentSegs.length-1?'<div class="tline"></div>':''}</div><div class="tco"><div class="tdate">${fmtD(s.date_from)}${s.time_dep&&s.time_dep!=='—'?' · '+s.time_dep:''}</div><div class="tlbl">${IC[s.type]} ${s.from_city||'?'} → ${s.to_city||'?'}</div>${s.dep_address?`<div class="tsub">📍 ${s.dep_address}</div>`:''}${s.arr_address?`<div class="tsub">🏁 ${s.arr_address}</div>`:''}${s.carrier?`<div class="tsub">${s.carrier}</div>`:''}</div></div>`;}).join('');
}

function renderBgt(){
  const bgt=document.getElementById('bgt'),btv=document.getElementById('btotal-val'),th=document.getElementById('trip-total');if(!bgt)return;
  let tot=0;bgt.innerHTML=currentSegs.map((seg,i)=>{const s=getSeg(i);const uah=toUAH(+s.price_amount||+s.price_usd||0,s.price_currency||'USD');tot+=uah;return`<div class="brow"><span class="lb">${s.from_city||'?'}→${s.to_city||'?'}</span><span class="am">${fmt(uah)}</span></div>`;}).join('');
  const ts=fmt(tot);if(btv)btv.textContent=ts;if(th)th.textContent=ts;
}

init();
</script>
</body>
</html>
