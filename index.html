<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планировщик поездки</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#0e0e12;--surface:#16161c;--surface2:#1e1e28;--border:#2a2a38;
    --accent:#f0c040;--accent2:#7c6ff0;--ok:#3dd68c;--warn:#f07850;--danger:#f05060;
    --text:#e8e8f0;--muted:#8888a8;
    --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}

  .header{padding:18px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:100;}
  .header h1{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-0.5px;color:var(--accent);}
  .header .sub{color:var(--muted);font-size:11px;font-family:var(--mono);}
  .total-badge{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-family:var(--mono);font-size:13px;}
  .total-badge span{color:var(--accent);font-weight:500;}

  .layout{display:grid;grid-template-columns:1fr 310px;min-height:calc(100vh - 65px);}
  @media(max-width:720px){.layout{grid-template-columns:1fr;}.sidebar{border-left:none;border-top:1px solid var(--border);}}

  .segments{padding:18px 24px;border-right:1px solid var(--border);}
  .seg-list{display:flex;flex-direction:column;gap:9px;}

  .seg{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s;}
  .seg:hover{border-color:#3a3a50;}
  .seg.haswarn{border-color:var(--warn);}

  .seg-header{display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;user-select:none;}
  .seg-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .icon-train{background:rgba(124,111,240,.15);}
  .icon-bus{background:rgba(61,214,140,.12);}
  .icon-flight{background:rgba(240,192,64,.15);}

  .seg-info{flex:1;min-width:0;}
  .seg-route{font-family:var(--display);font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .seg-route .arr{color:var(--muted);font-weight:400;}
  .seg-meta{margin-top:2px;color:var(--muted);font-size:10px;font-family:var(--mono);display:flex;gap:8px;flex-wrap:wrap;}

  .seg-price{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ok);text-align:right;flex-shrink:0;}
  .seg-price .usd{font-size:10px;color:var(--muted);}

  .wbadge{background:rgba(240,120,80,.15);color:var(--warn);border:1px solid rgba(240,120,80,.3);border-radius:4px;padding:1px 5px;font-size:9px;font-family:var(--mono);}

  .seg-edit{display:none;border-top:1px solid var(--border);padding:14px;background:var(--surface2);flex-direction:column;gap:11px;}
  .seg-edit.open{display:flex;}

  .frow{display:flex;gap:9px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px;}
  .field label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 8px;outline:none;width:100%;transition:border-color .2s;}
  .field input:focus,.field select:focus{border-color:var(--accent2);}

  .nbox{background:rgba(240,120,80,.08);border:1px solid rgba(240,120,80,.25);border-radius:7px;padding:8px 11px;font-size:11px;color:var(--warn);font-family:var(--mono);line-height:1.6;}
  .nbox.info{background:rgba(124,111,240,.08);border-color:rgba(124,111,240,.25);color:#a09af0;}

  .alerts{padding:0 24px 12px;}
  .alert{display:flex;align-items:flex-start;gap:7px;padding:8px 11px;border-radius:7px;margin-bottom:6px;font-size:11px;font-family:var(--mono);line-height:1.5;}
  .alert.danger{background:rgba(240,80,96,.1);border:1px solid rgba(240,80,96,.25);color:#f08090;}
  .alert.warn{background:rgba(240,120,80,.1);border:1px solid rgba(240,120,80,.25);color:var(--warn);}
  .alert.ok{background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.2);color:var(--ok);}
  .ai{font-size:12px;flex-shrink:0;margin-top:1px;}

  .sidebar{padding:18px;display:flex;flex-direction:column;gap:14px;}
  .sc{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .sc h3{padding:10px 13px 9px;font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}

  .bgt{padding:9px 13px;}
  .brow{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;}
  .brow:last-child{border-bottom:none;}
  .brow .lb{color:var(--muted);font-family:var(--mono);font-size:10px;}
  .brow .am{font-family:var(--mono);color:var(--text);}
  .btotal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 13px;border-top:2px solid var(--border);font-family:var(--display);font-weight:700;font-size:12px;}
  .btotal .am{color:var(--accent);font-size:16px;}

  .tl{padding:9px 13px;display:flex;flex-direction:column;}
  .tli{display:flex;gap:9px;padding-bottom:10px;}
  .tli:last-child{padding-bottom:0;}
  .tdc{display:flex;flex-direction:column;align-items:center;width:13px;flex-shrink:0;}
  .td{width:8px;height:8px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);margin-top:3px;flex-shrink:0;}
  .td.flight{background:var(--accent);}
  .td.arrive{background:var(--ok);}
  .tline{flex:1;width:1px;background:var(--border);margin-top:2px;}
  .tco{flex:1;}
  .tdate{font-family:var(--mono);font-size:9px;color:var(--muted);}
  .tlbl{font-size:11px;font-weight:500;margin-top:1px;}

  .lug{padding:9px 13px;font-size:10px;font-family:var(--mono);line-height:1.9;}
  .lok{color:var(--ok);}
  .lwrn{color:var(--warn);}

  .stitle{font-family:var(--display);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:9px;}
  .chev{color:var(--muted);transition:transform .2s;font-size:10px;margin-left:2px;flex-shrink:0;}
  .chev.open{transform:rotate(180deg);}

  .tpill{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:3px;font-weight:500;}
  .tp-train{background:rgba(124,111,240,.2);color:#a09af0;}
  .tp-bus{background:rgba(61,214,140,.15);color:#5dd6a0;}
  .tp-flight{background:rgba(240,192,64,.2);color:var(--accent);}

  .sbtn{background:var(--accent2);color:#fff;border:none;border-radius:5px;padding:6px 13px;font-family:var(--mono);font-size:11px;cursor:pointer;align-self:flex-end;transition:opacity .2s;}
  .sbtn:hover{opacity:.85;}
</style>
</head>
<body>

<div class="header">
  <h1>✈ МОЯ ПОЕЗДКА</h1>
  <div class="sub">Киев → Тель-Авив → Кишинёв → Киев &nbsp;·&nbsp; июнь–июль 2026</div>
  <div class="total-badge">Итого: <span id="total-uah">—</span></div>
</div>

<div id="alerts" class="alerts"></div>

<div class="layout">
  <div class="segments">
    <div class="stitle">Сегменты маршрута</div>
    <div class="seg-list" id="seg-list"></div>
  </div>
  <div class="sidebar">
    <div class="sc"><h3>📅 Хронология</h3><div class="tl" id="tl"></div></div>
    <div class="sc"><h3>💰 Бюджет (грн)</h3><div class="bgt" id="bgt"></div><div class="btotal"><span>ИТОГО</span><span class="am" id="btotal">—</span></div></div>
    <div class="sc"><h3>🧳 Багаж</h3><div class="lug" id="lug"></div></div>
  </div>
</div>

<script>
const UAH = 41;
const segs = [
  {id:1,type:'train',icon:'🚂',from:'Киев',to:'Хелм (Польша)',
   dateFrom:'2026-06-20',timeDep:'06:28',timeArr:'17:27',dateTo:'2026-06-20',
   priceUSD:28,carrier:'УЗ / PKP (поезд 023К)',duration:'~11 ч',
   notes:'Прямой поезд. Купе ~1174 грн, люкс ~1548 грн. Отправление утром, прибытие в Хелм в 17:27 — стыкуется с варшавским поездом.',
   noteType:'info',booking:'tickets.ua или кассы УЗ',luggageOk:true},
  {id:2,type:'train',icon:'🚆',from:'Хелм',to:'Варшава',
   dateFrom:'2026-06-20',timeDep:'18:10',timeArr:'21:00',dateTo:'2026-06-20',
   priceUSD:12,carrier:'PKP Intercity',duration:'~2 ч 50 мин',
   notes:'Региональный поезд PKP. Пересадка в Хелме ~45 мин. Проверьте расписание на pkp.pl на день поездки.',
   noteType:'warn',booking:'pkp.pl или koleo.pl',luggageOk:true},
  {id:3,type:'bus',icon:'🚌',from:'Варшава',to:'Франкфурт-на-Майне',
   dateFrom:'2026-06-21',timeDep:'22:00',timeArr:'13:00',dateTo:'2026-06-22',
   priceUSD:55,carrier:'FlixBus',duration:'~15 ч',
   notes:'Рекомендуем ночной FlixBus (~22:00) — прибывает утром во Франкфурт, не нужно ночевать. Отправление со ст. Варшава Западная.',
   noteType:'info',booking:'flixbus.com',luggageOk:true},
  {id:4,type:'flight',icon:'✈️',from:'Франкфурт (FRA)',to:'Тель-Авив (TLV)',
   dateFrom:'2026-06-28',timeDep:'—',timeArr:'—',dateTo:'2026-06-28',
   priceUSD:175,carrier:'SKY express / El Al / Aegean',duration:'~4 ч',
   notes:'Проверьте Google Flights / Skyscanner на 28 июня. Дешевле всего SKY express от ~$160. El Al — прямой рейс ~$200+. Ryanair берёт доплату за второй предмет багажа!',
   noteType:'warn',booking:'google.com/travel/flights',luggageOk:false,
   luggageNote:'⚠️ Ryanair: рюкзак 40×30×20 = 2-й предмет, доплата при регистрации. Выбирайте El Al или Aegean.'},
  {id:5,type:'flight',icon:'✈️',from:'Тель-Авив (TLV)',to:'Кишинёв (RMO)',
   dateFrom:'2026-07-03',timeDep:'—',timeArr:'—',dateTo:'2026-07-03',
   priceUSD:110,carrier:'FlyOne / HiSky / Wizz Air',duration:'~2 ч 55 мин',
   notes:'FlyOne — самый популярный (42% бронирований). Прямой рейс. Цены от $94. Уточните наличие на конкретную дату.',
   noteType:'info',booking:'flyone.eu или kiwi.com',luggageOk:true},
  {id:6,type:'bus',icon:'🚌',from:'Кишинёв',to:'Киев',
   dateFrom:'2026-07-04',timeDep:'06:00',timeArr:'18:00',dateTo:'2026-07-04',
   priceUSD:25,carrier:'FlixBus / GAL Trans / Transmarine',duration:'~11–12 ч',
   notes:'Автобус от Северного автовокзала Кишинёва. FlixBus от ~$26, GAL Trans / Transmarine от ~$20. Самый быстрый рейс ~10 ч.',
   noteType:'info',booking:'flixbus.com или busbud.com',luggageOk:true},
];

let state = segs.map(s=>({...s}));

function fmt(usd){return Math.round(usd*UAH).toLocaleString('ru-RU')+' ₴';}
function fmtD(d){const[,m,day]=d.split('-');const mn=['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];return `${+day} ${mn[+m]}`;}
const tlabel={train:'ПОЕЗД',bus:'АВТОБУС',flight:'РЕЙС'};

function renderAll(){renderAlerts();renderSegs();renderTL();renderBgt();renderLug();}

function renderAlerts(){
  const a=[];
  // timing gap check
  const s1=state[1],s2=state[2];
  if(s2.dateFrom===s1.dateTo){
    const gap=(+s2.timeDep.replace(':',''))-(+s1.timeArr.replace(':',''));
    if(gap<200) a.push({t:'danger',i:'⏱',txt:`Мало времени между прибытием в Варшаву (${s1.timeArr}) и отправлением автобуса (${s2.timeDep}). Рекомендуем ночной FlixBus (~22:00).`});
  }
  if(state.some(s=>!s.luggageOk)) a.push({t:'warn',i:'🧳',txt:'На рейсе FRA→TLV возможны ограничения по багажу в зависимости от перевозчика. Уточните правила до покупки.'});
  a.push({t:'warn',i:'💡',txt:'Билет FRA→TLV на 28 июня — бронируйте сейчас. Июнь — пик сезона, цены растут.'});
  a.push({t:'ok',i:'✓',txt:'Маршрут логичный. Все основные стыковки имеют достаточный запас времени.'});
  document.getElementById('alerts').innerHTML=a.map(x=>`<div class="alert ${x.t}"><span class="ai">${x.i}</span><span>${x.txt}</span></div>`).join('');
}

function renderSegs(){
  document.getElementById('seg-list').innerHTML=state.map((s,i)=>`
  <div class="seg ${s.luggageOk?'':'haswarn'}" id="sg${s.id}">
    <div class="seg-header" onclick="tog(${i})">
      <div class="seg-icon icon-${s.type}">${s.icon}</div>
      <div class="seg-info">
        <div class="seg-route">
          <span class="tpill tp-${s.type}">${tlabel[s.type]}</span>
          ${s.from}<span class="arr">→</span>${s.to}
          ${s.luggageOk?'':'<span class="wbadge">⚠ багаж</span>'}
        </div>
        <div class="seg-meta">
          <span>📅 ${fmtD(s.dateFrom)}</span>
          <span>⏰ ${s.timeDep!=='—'?s.timeDep+' → '+s.timeArr:'уточнить'}</span>
          <span>⏱ ${s.duration}</span>
        </div>
      </div>
      <div class="seg-price">${fmt(s.priceUSD)}<div class="usd">~$${s.priceUSD}</div></div>
      <span class="chev" id="ch${i}">▼</span>
    </div>
    <div class="seg-edit" id="ed${i}">
      <div class="frow">
        <div class="field"><label>Дата выезда</label><input type="date" value="${s.dateFrom}" onchange="upd(${i},'dateFrom',this.value)"></div>
        <div class="field"><label>Отправление</label><input type="time" value="${s.timeDep!=='—'?s.timeDep:''}" onchange="upd(${i},'timeDep',this.value||'—')"></div>
        <div class="field"><label>Прибытие</label><input type="time" value="${s.timeArr!=='—'?s.timeArr:''}" onchange="upd(${i},'timeArr',this.value||'—')"></div>
        <div class="field"><label>Цена (USD)</label><input type="number" value="${s.priceUSD}" min="0" onchange="upd(${i},'priceUSD',+this.value)"></div>
      </div>
      <div class="frow">
        <div class="field" style="flex:2"><label>Перевозчик</label><input type="text" value="${s.carrier}" onchange="upd(${i},'carrier',this.value)"></div>
        <div class="field"><label>Где купить</label><input type="text" value="${s.booking}" onchange="upd(${i},'booking',this.value)"></div>
      </div>
      <div class="nbox ${s.noteType==='info'?'info':''}">${s.noteType==='info'?'ℹ️':'⚠️'} ${s.notes}</div>
      ${s.luggageNote?`<div class="nbox">${s.luggageNote}</div>`:''}
      <button class="sbtn" onclick="tog(${i})">Сохранить ✓</button>
    </div>
  </div>`).join('');
}

function tog(i){
  const e=document.getElementById(`ed${i}`),c=document.getElementById(`ch${i}`);
  const was=e.classList.contains('open');
  document.querySelectorAll('.seg-edit').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.chev').forEach(x=>x.classList.remove('open'));
  if(!was){e.classList.add('open');c.classList.add('open');}
}
function upd(i,k,v){state[i][k]=v;renderAll();setTimeout(()=>{document.getElementById(`ed${i}`).classList.add('open');document.getElementById(`ch${i}`).classList.add('open');},10);}

function renderTL(){
  const ev=[
    {d:'20 июня',l:'Выезд из Киева (поезд 06:28)',t:'d'},
    {d:'20 июня, 17:27',l:'Хелм → пересадка на Варшаву',t:'t'},
    {d:'20 июня, 21:00',l:'Прибытие в Варшаву',t:'t'},
    {d:'21 июня, ~22:00',l:'Ночной автобус → Франкфурт 🚌',t:'d'},
    {d:'22–27 июня',l:'6 дней во Франкфурте 🇩🇪',t:'s'},
    {d:'28 июня',l:'Рейс FRA → TLV ✈️',t:'f'},
    {d:'28 июня – 3 июля',l:'Тель-Авив 🇮🇱',t:'s'},
    {d:'3 июля',l:'Рейс TLV → Кишинёв ✈️',t:'f'},
    {d:'4 июля, утро',l:'Автобус Кишинёв → Киев 🚌',t:'d'},
    {d:'4 июля, вечер',l:'🏠 Дома!',t:'a'},
  ];
  document.getElementById('tl').innerHTML=ev.map((e,i)=>`
  <div class="tli">
    <div class="tdc">
      <div class="td ${e.t==='f'?'flight':e.t==='a'?'arrive':''}"></div>
      ${i<ev.length-1?'<div class="tline"></div>':''}
    </div>
    <div class="tco"><div class="tdate">${e.d}</div><div class="tlbl">${e.l}</div></div>
  </div>`).join('');
}

function renderBgt(){
  let tot=0;
  document.getElementById('bgt').innerHTML=state.map(s=>{
    const u=s.priceUSD*UAH;tot+=u;
    return `<div class="brow"><span class="lb">${s.from.split(' ')[0]} → ${s.to.split('(')[0].trim().split(' ')[0]}</span><span class="am">${Math.round(u).toLocaleString('ru-RU')} ₴</span></div>`;
  }).join('');
  const ts=Math.round(tot).toLocaleString('ru-RU')+' ₴';
  document.getElementById('btotal').textContent=ts;
  document.getElementById('total-uah').textContent=ts;
}

function renderLug(){
  document.getElementById('lug').innerHTML=`
    <div style="color:var(--muted);margin-bottom:5px">Ваш багаж:</div>
    <div style="margin-bottom:7px">🧳 Чемодан 55×40×20 (ручная кладь)<br>🎒 Рюкзак 40×30×20</div>
    <div class="lok">✓ Поезд УЗ (Киев–Хелм) — без ограничений</div>
    <div class="lok">✓ PKP (Хелм–Варшава) — без ограничений</div>
    <div class="lok">✓ FlixBus — 1 чемодан + 1 ручная кладь бесплатно</div>
    <div class="lwrn">⚠ FRA→TLV: зависит от авиакомпании<br>&nbsp;&nbsp;El Al / Aegean — ОК<br>&nbsp;&nbsp;Ryanair — рюкзак = 2-й предмет, доплата!</div>
    <div class="lok">✓ FlyOne (TLV→RMO) — обычно ОК</div>
    <div class="lok">✓ Автобус Кишинёв–Киев — без ограничений</div>`;
}

renderAll();
</script>
</body>
</html>
